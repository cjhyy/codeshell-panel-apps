<!doctype html>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ffffff; }
  #fixture { position: relative; width: 160px; height: 100px; background: #ffffff; }
  #status-dot { position: absolute; left: 12px; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
  #bordered-circle { position: absolute; left: 40px; top: 12px; width: 34px; height: 34px; border: 2px solid #111111; border-radius: 50%; background: #2563eb; }
  #mixed-circle { position: absolute; left: 88px; top: 12px; width: 40px; height: 40px; border-radius: 25% 10px; background: #e23838; }
</style>
<main id="fixture"><div id="status-dot"></div><div id="bordered-circle"></div><div id="mixed-circle"></div></main>
