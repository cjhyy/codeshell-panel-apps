name: Validate Panel Apps

on:
  push:
  pull_request:

permissions:
  contents: read

# Keep independent gates runnable even when another app fails. The previous
# sequential video-media gate prevented UI and design regressions from running.
jobs:
  job-hunt-pdf:
    name: Job Hunt PDF rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install PDF inspection tools and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils fonts-noto-cjk
      - name: Diagnose sandboxed Chromium startup
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { spawnSync } from 'node:child_process';
          import { mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const profile = mkdtempSync(join(tmpdir(), 'pdf-sandbox-probe-'));
          try {
            const result = spawnSync(chromium.executablePath(), ['--headless=new', '--no-first-run', '--disable-background-networking', '--user-data-dir=' + profile, '--dump-dom', 'about:blank'], { encoding: 'utf8', timeout: 15000 });
            console.log(JSON.stringify({ status: result.status, signal: result.signal, stderr: result.stderr?.slice(-8192) }));
            if (result.status !== 0) process.exitCode = 1;
          } finally { rmSync(profile, { recursive: true, force: true }); }
          NODE
      - run: node --test tests/apps/job-hunt-hq/resume-pdf-native.test.mjs

  validate:
    name: Package and offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  video-ui:
    name: Video Studio UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: npm run test:ui:video-studio

  video-media:
    name: Video Studio media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: npm run test:media:video-studio

  design-studio:
    name: Design Studio fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:large-doc
      - run: npm run test:fidelity
      - run: npm run test:fidelity:cases

  quant-lab:
    name: Validate Quant Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:quant-lab
      - run: npm run test:ui:quant-lab

  video-download:
    name: Validate Video Download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:video-download
