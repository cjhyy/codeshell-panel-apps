name: Validate Panel Apps

on:
  push:
  pull_request:

permissions:
  contents: read

# Keep independent gates runnable even when another app fails. The previous
# sequential video-media gate prevented UI and design regressions from running.
jobs:
  job-hunt-pdf:
    name: Job Hunt PDF rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install PDF inspection tools and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils fonts-noto-cjk
      # Ubuntu restricts user namespaces for downloaded browser builds. Allow
      # only this exact executable in the disposable runner; retain Chromium's
      # sandbox and the machine-wide AppArmor user namespace restriction.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Allow the test browser to create its sandbox
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          writeFileSync('/tmp/codeshell-pdf-chromium.apparmor', `abi <abi/4.0>,\ninclude <tunables/global>\nprofile codeshell-pdf-ci "${chromium.executablePath()}" flags=(unconfined) {\n  userns,\n}\n`);
          NODE
          sudo apparmor_parser -r /tmp/codeshell-pdf-chromium.apparmor
      - name: Diagnose sandboxed Chromium startup
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const profile = await mkdtemp(join(tmpdir(), 'pdf-sandbox-probe-'));
          let context;
          try {
            context = await chromium.launchPersistentContext(profile, {
              executablePath: chromium.executablePath(),
              chromiumSandbox: true,
              headless: true,
              timeout: 15000,
            });
            const page = await context.newPage();
            await page.goto('about:blank', { timeout: 15000 });
            console.log(JSON.stringify({ sandbox: true, url: page.url() }));
          } finally {
            // Close the owned browser process tree before deleting its profile.
            await context?.close();
            await rm(profile, { recursive: true, force: true, maxRetries: 5, retryDelay: 200 });
          }
          NODE
      - run: node --test tests/apps/job-hunt-hq/resume-pdf-native.test.mjs

  validate:
    name: Package and offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  video-ui:
    name: Video Studio UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: npm run test:ui:video-studio
      - name: Retain exact-duration UI media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-exact-duration-ui
          path: artifacts/video-studio/exact-browser-duration
          if-no-files-found: ignore

  video-media:
    name: Video Studio media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: npm run test:media:video-studio
      - name: Retain exact-duration encoder media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-exact-duration-encoder
          path: artifacts/video-studio/exact-browser-duration
          if-no-files-found: ignore

  design-studio:
    name: Design Studio fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/apps/design-studio/polish-ui.test.mjs
      - run: npm run test:large-doc
      - run: npm run test:fidelity
      - run: npm run test:fidelity:cases

  quant-lab:
    name: Validate Quant Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:quant-lab
      - run: npm run test:ui:quant-lab

  video-download:
    name: Validate Video Download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:video-download
